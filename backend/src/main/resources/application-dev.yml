spring:
  datasource:
    password: ${DB_PASSWORD:}
  jpa:
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-jwt-signing-key-override-via-env-in-production-64chars}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

logging:
  level:
    com.quickkart: INFO
    org.springframework.security: INFO
